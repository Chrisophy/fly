<!DOCTYPE html>
<html lang="de" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IPTV Stream Hub</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        dark: {
                            900: '#0b0f19',
                            800: '#111827',
                            700: '#1f2937',
                            600: '#374151',
                        }
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #111827; }
        ::-webkit-scrollbar-thumb { background: #374151; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #4b5563; }
        .channel-card { transition: all 0.2s ease; }
        .channel-card:hover { transform: translateY(-2px); box-shadow: 0 10px 25px -5px rgba(99, 102, 241, 0.25); }
    </style>
</head>
<body class="bg-dark-900 text-gray-100 min-h-screen flex flex-col font-sans select-none">

    <!-- Header -->
    <header class="bg-dark-800 border-b border-gray-800 sticky top-0 z-50 px-4 py-3 shadow-lg">
        <div class="max-w-7xl mx-auto flex flex-col md:flex-row items-center justify-between gap-4">
            <div class="flex items-center space-x-3 w-full md:w-auto justify-between md:justify-start">
                <div class="flex items-center space-x-3">
                    <div class="bg-indigo-600 text-white p-2.5 rounded-xl shadow-lg shadow-indigo-600/30 flex items-center justify-center">
                        <i class="fa-solid fa-tv text-lg"></i>
                    </div>
                    <div>
                        <h1 class="text-lg font-bold tracking-tight bg-gradient-to-r from-indigo-400 to-cyan-400 bg-clip-text text-transparent">IPTV Stream Hub</h1>
                        <p class="text-xs text-gray-400" id="channel-count">Lade Playlist...</p>
                    </div>
                </div>
                <button id="mobile-menu-btn" class="md:hidden text-gray-400 hover:text-white p-2">
                    <i class="fa-solid fa-bars text-xl"></i>
                </button>
            </div>

            <!-- Suchfeld -->
            <div class="w-full md:w-96 relative">
                <span class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none text-gray-400">
                    <i class="fa-solid fa-magnifying-glass"></i>
                </span>
                <input type="text" id="search-input" placeholder="Sender suchen..." 
                    class="w-full pl-10 pr-4 py-2 bg-dark-900 border border-gray-700 rounded-xl text-sm focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition-all text-gray-200 placeholder-gray-500">
            </div>

            <!-- Steuerung -->
            <div class="flex items-center space-x-2 w-full md:w-auto justify-end">
                <button id="reload-btn" class="px-3 py-2 bg-dark-700 hover:bg-dark-600 text-gray-300 rounded-xl text-sm font-medium flex items-center space-x-2 transition-colors border border-gray-700">
                    <i class="fa-solid fa-rotate"></i>
                    <span class="hidden sm:inline">Aktualisieren</span>
                </button>
                <label class="px-3 py-2 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl text-sm font-medium flex items-center space-x-2 cursor-pointer transition-colors shadow-lg shadow-indigo-600/20">
                    <i class="fa-solid fa-file-arrow-up"></i>
                    <span>M3U Laden</span>
                    <input type="file" id="m3u-file-input" accept=".m3u,.m3u8" class="hidden">
                </label>
            </div>
        </div>
    </header>

    <!-- Hauptbereich -->
    <div class="max-w-7xl mx-auto w-full flex-1 flex flex-col md:flex-row p-4 gap-6">
        
        <!-- Sidebar (Kategorien) -->
        <aside id="sidebar" class="w-full md:w-64 bg-dark-800 border border-gray-800 rounded-2xl p-4 flex-shrink-0 hidden md:flex flex-col space-y-6 h-fit md:sticky md:top-20">
            <div>
                <h3 class="text-xs font-semibold uppercase tracking-wider text-gray-400 px-3 mb-3">Filter</h3>
                <nav class="space-y-1">
                    <button data-category="all" class="category-btn w-full flex items-center justify-between px-3 py-2.5 rounded-xl text-sm font-medium bg-indigo-600/20 text-indigo-400 border border-indigo-500/30 transition-all">
                        <span class="flex items-center space-x-3"><i class="fa-solid fa-globe w-5 text-center"></i><span>Alle Sender</span></span>
                        <span id="count-all" class="text-xs bg-indigo-500/20 px-2 py-0.5 rounded-full">0</span>
                    </button>
                    <button data-category="favorites" class="category-btn w-full flex items-center justify-between px-3 py-2.5 rounded-xl text-sm font-medium text-gray-400 hover:bg-dark-700 hover:text-gray-200 transition-all">
                        <span class="flex items-center space-x-3"><i class="fa-solid fa-star w-5 text-center text-amber-400"></i><span>Favoriten</span></span>
                        <span id="count-favs" class="text-xs bg-gray-700 px-2 py-0.5 rounded-full">0</span>
                    </button>
                </nav>
            </div>

            <div class="flex-1 overflow-y-auto max-h-[calc(100vh-280px)]">
                <h3 class="text-xs font-semibold uppercase tracking-wider text-gray-400 px-3 mb-3">Kategorien</h3>
                <div id="category-list" class="space-y-1"></div>
            </div>
        </aside>

        <!-- Content -->
        <main class="flex-1 flex flex-col space-y-4">
            
            <!-- Alphabetische Sortierung (#, A-Z) -->
            <div class="bg-dark-800 border border-gray-800 rounded-2xl p-3 shadow-md">
                <div class="flex items-center justify-between mb-2 px-1">
                    <span class="text-xs font-semibold uppercase tracking-wider text-gray-400">
                        <i class="fa-solid fa-arrow-down-a-z mr-1.5 text-indigo-400"></i>Nach Anfangsbuchstabe sortieren
                    </span>
                    <button id="reset-letter-btn" class="text-xs text-indigo-400 hover:text-indigo-300 font-medium hidden">Filter zurücksetzen</button>
                </div>
                <div id="alphabet-bar" class="flex flex-wrap gap-1.5 justify-between">
                    <button data-letter="ALL" class="alpha-btn px-3 py-1.5 rounded-lg text-xs font-bold bg-indigo-600 text-white shadow transition-all">Alle</button>
                    <button data-letter="#" class="alpha-btn px-2.5 py-1.5 rounded-lg text-xs font-bold bg-dark-700 text-gray-300 hover:bg-dark-600 transition-all">#</button>
                </div>
            </div>

            <!-- Header der Senderliste -->
            <div class="flex items-center justify-between px-1">
                <div class="flex items-center space-x-2">
                    <h2 id="current-view-title" class="text-base font-bold text-gray-200">Alle Sender</h2>
                    <span id="filtered-count" class="text-xs bg-dark-800 text-gray-400 px-2.5 py-1 rounded-full border border-gray-700">0 Sender</span>
                </div>
            </div>

            <!-- Sender Raster -->
            <div id="channels-grid" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-3.5"></div>

            <!-- Leer-Zustand -->
            <div id="empty-state" class="hidden flex flex-col items-center justify-center py-16 text-center bg-dark-800/50 border border-gray-800 rounded-2xl">
                <div class="w-16 h-16 rounded-full bg-dark-700 flex items-center justify-center text-gray-500 text-2xl mb-4">
                    <i class="fa-solid fa-triangle-exclamation"></i>
                </div>
                <h3 class="text-base font-semibold text-gray-300">Keine Sender gefunden</h3>
                <p class="text-xs text-gray-500 mt-1 max-w-sm">Bitte überprüfen Sie Ihre Suche oder den gewählten Buchstaben- bzw. Kategorie-Filter.</p>
            </div>
        </main>
    </div>

    <!-- Footer -->
    <footer class="bg-dark-800 border-t border-gray-800 py-4 mt-8 text-center text-xs text-gray-500">
        <p>Moderne IPTV Playlist &mdash; Optimiert für M3U Playlists mit A-Z Sortierung</p>
    </footer>

    <!-- JavaScript Logik -->
    <script>
        const DEFAULT_M3U_URL = "https://raw.githubusercontent.com/Chrisophy/fly/refs/heads/main/krautsalat";
        
        let allChannels = [];
        let activeCategory = 'all';
        let activeLetter = 'ALL';
        let searchQuery = '';
        let favorites = JSON.parse(localStorage.getItem('iptv_favorites') || '[]');

        const channelsGrid = document.getElementById('channels-grid');
        const searchInput = document.getElementById('search-input');
        const channelCountEl = document.getElementById('channel-count');
        const filteredCountEl = document.getElementById('filtered-count');
        const currentViewTitle = document.getElementById('current-view-title');
        const categoryListEl = document.getElementById('category-list');
        const emptyStateEl = document.getElementById('empty-state');
        const reloadBtn = document.getElementById('reload-btn');
        const m3uFileInput = document.getElementById('m3u-file-input');
        const alphabetBar = document.getElementById('alphabet-bar');
        const resetLetterBtn = document.getElementById('reset-letter-btn');
        const mobileMenuBtn = document.getElementById('mobile-menu-btn');
        const sidebar = document.getElementById('sidebar');

        // A-Z Buttons generieren
        function initAlphabetBar() {
            for (let i = 65; i <= 90; i++) {
                let char = String.fromCharCode(i);
                let btn = document.createElement('button');
                btn.className = 'alpha-btn px-2.5 py-1.5 rounded-lg text-xs font-bold bg-dark-700 text-gray-300 hover:bg-dark-600 transition-all';
                btn.dataset.letter = char;
                btn.textContent = char;
                btn.addEventListener('click', () => setLetterFilter(char));
                alphabetBar.appendChild(btn);
            }
            
            document.querySelectorAll('.alpha-btn').forEach(btn => {
                if (!btn.dataset.letterBound) {
                    btn.dataset.letterBound = 'true';
                    btn.addEventListener('click', () => setLetterFilter(btn.dataset.letter));
                }
            });
        }

        function setLetterFilter(letter) {
            activeLetter = letter;
            document.querySelectorAll('.alpha-btn').forEach(b => {
                if (b.dataset.letter === letter) {
                    b.className = 'alpha-btn px-2.5 py-1.5 rounded-lg text-xs font-bold bg-indigo-600 text-white shadow transition-all';
                } else {
                    b.className = 'alpha-btn px-2.5 py-1.5 rounded-lg text-xs font-bold bg-dark-700 text-gray-300 hover:bg-dark-600 transition-all';
                }
            });
            
            if (letter !== 'ALL') {
                resetLetterBtn.classList.remove('hidden');
            } else {
                resetLetterBtn.classList.add('hidden');
            }
            renderChannels();
        }

        resetLetterBtn.addEventListener('click', () => setLetterFilter('ALL'));

        mobileMenuBtn.addEventListener('click', () => sidebar.classList.toggle('hidden'));

        // Playlist laden (mit Fallback auf CORS-Proxy falls nötig)
        async function loadPlaylist(url) {
            channelCountEl.textContent = "Lade Playlist...";
            try {
                let response = await fetch(url);
                if (!response.ok) throw new Error("Netzwerkfehler");
                let text = await response.text();
                parseM3U(text);
            } catch (err) {
                try {
                    let proxyUrl = "https://api.allorigins.win/raw?url=" + encodeURIComponent(url);
                    let response = await fetch(proxyUrl);
                    if (!response.ok) throw new Error("Proxy-Fehler");
                    let text = await response.text();
                    parseM3U(text);
                } catch (err2) {
                    channelCountEl.textContent = "Fehler beim Laden";
                    alert("Playlist konnte nicht geladen werden. Nutzen Sie alternativ den 'M3U Laden' Button.");
                }
            }
        }

        // Robuster M3U Parser ohne RegEx-Zeilenumbruch-Probleme
        function parseM3U(content) {
            const normalized = content.replace(/\r\n/g, '\n').replace(/\r/g, '\n');
            const lines = normalized.split('\n');
            let channels = [];
            let currentChannel = {};

            for (let i = 0; i < lines.length; i++) {
                let line = lines[i].trim();
                if (line.startsWith('#EXTINF:')) {
                    currentChannel = {};
                    
                    let tvgLogoMatch = line.match(/tvg-logo="([^"]*)"/);
                    let tvgIdMatch = line.match(/tvg-id="([^"]*)"/);
                    let groupMatch = line.match(/group-title="([^"]*)"/);
                    
                    currentChannel.logo = tvgLogoMatch ? tvgLogoMatch[1] : '';
                    currentChannel.id = tvgIdMatch ? tvgIdMatch[1] : '';
                    currentChannel.category = groupMatch ? groupMatch[1].trim() : 'Allgemein';
                    
                    let commaIdx = line.lastIndexOf(',');
                    if (commaIdx !== -1) {
                        currentChannel.name = line.substring(commaIdx + 1).trim();
                    } else {
                        currentChannel.name = 'Unbekannter Sender';
                    }
                } else if (line && !line.startsWith('#')) {
                    currentChannel.url = line;
                    if (currentChannel.name && currentChannel.url) {
                        channels.push({
                            id: currentChannel.id || Math.random().toString(36).substring(7),
                            name: currentChannel.name,
                            logo: currentChannel.logo,
                            category: currentChannel.category || 'Allgemein',
                            url: currentChannel.url
                        });
                    }
                    currentChannel = {};
                }
            }

            allChannels = channels;
            channelCountEl.textContent = `${allChannels.length} Sender geladen`;
            buildCategories();
            renderChannels();
        }

        m3uFileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (evt) => parseM3U(evt.target.result);
            reader.readAsText(file);
        });

        reloadBtn.addEventListener('click', () => loadPlaylist(DEFAULT_M3U_URL));

        function buildCategories() {
            let catCounts = {};
            allChannels.forEach(ch => {
                catCounts[ch.category] = (catCounts[ch.category] || 0) + 1;
            });

            let sortedCats = Object.keys(catCounts).sort();
            document.getElementById('count-all').textContent = allChannels.length;
            document.getElementById('count-favs').textContent = favorites.length;

            let html = '';
            sortedCats.forEach(cat => {
                let count = catCounts[cat];
                let isActive = activeCategory === cat;
                html += `
                    <button data-category="${escapeHtml(cat)}" class="category-btn w-full flex items-center justify-between px-3 py-2.5 rounded-xl text-sm font-medium ${isActive ? 'bg-indigo-600/20 text-indigo-400 border border-indigo-500/30' : 'text-gray-400 hover:bg-dark-700 hover:text-gray-200'} transition-all">
                        <span class="flex items-center space-x-3 truncate"><i class="fa-solid fa-folder w-5 text-center flex-shrink-0"></i><span class="truncate">${escapeHtml(cat)}</span></span>
                        <span class="text-xs bg-dark-700 px-2 py-0.5 rounded-full flex-shrink-0">${count}</span>
                    </button>
                `;
            });
            categoryListEl.innerHTML = html;

            document.querySelectorAll('.category-btn').forEach(btn => {
                btn.addEventListener('click', () => setActiveCategory(btn.dataset.category, btn));
            });
        }

        function setActiveCategory(cat, btnEl) {
            activeCategory = cat;
            document.querySelectorAll('.category-btn').forEach(b => {
                b.className = 'category-btn w-full flex items-center justify-between px-3 py-2.5 rounded-xl text-sm font-medium text-gray-400 hover:bg-dark-700 hover:text-gray-200 transition-all';
            });
            if (btnEl) {
                btnEl.className = 'category-btn w-full flex items-center justify-between px-3 py-2.5 rounded-xl text-sm font-medium bg-indigo-600/20 text-indigo-400 border border-indigo-500/30 transition-all';
            }

            if (cat === 'all') currentViewTitle.textContent = 'Alle Sender';
            else if (cat === 'favorites') currentViewTitle.textContent = 'Favoriten';
            else currentViewTitle.textContent = cat;

            renderChannels();
        }

        searchInput.addEventListener('input', (e) => {
            searchQuery = e.target.value.toLowerCase().trim();
            renderChannels();
        });

        function renderChannels() {
            let filtered = allChannels.filter(ch => {
                if (activeCategory === 'favorites') {
                    if (!favorites.includes(ch.id)) return false;
                } else if (activeCategory !== 'all') {
                    if (ch.category !== activeCategory) return false;
                }

                if (searchQuery && !ch.name.toLowerCase().includes(searchQuery) && !ch.category.toLowerCase().includes(searchQuery)) {
                    return false;
                }

                if (activeLetter !== 'ALL') {
                    let firstChar = ch.name.trim().charAt(0).toUpperCase();
                    if (activeLetter === '#') {
                        if (/^[A-Z]/.test(firstChar)) return false;
                    } else {
                        if (firstChar !== activeLetter) return false;
                    }
                }
                return true;
            });

            filteredCountEl.textContent = `${filtered.length} Sender`;

            if (filtered.length === 0) {
                channelsGrid.innerHTML = '';
                emptyStateEl.classList.remove('hidden');
                return;
            }

            emptyStateEl.classList.add('hidden');

            let html = '';
            filtered.forEach(ch => {
                let isFav = favorites.includes(ch.id);
                let logoHtml = ch.logo ? 
                    `<img src="${escapeHtml(ch.logo)}" alt="" class="w-12 h-12 object-contain rounded-lg bg-dark-900/50 p-1" onerror="this.onerror=null; this.src=''; this.parentNode.innerHTML='<i class=\"fa-solid fa-tv text-indigo-400 text-lg\"></i>';">` :
                    `<div class="w-12 h-12 rounded-lg bg-indigo-600/20 flex items-center justify-center text-indigo-400"><i class="fa-solid fa-tv text-lg"></i></div>`;

                html += `
                    <div class="channel-card bg-dark-800 border border-gray-800 hover:border-indigo-500/50 rounded-2xl p-3.5 flex flex-col justify-between relative group cursor-pointer" onclick="window.open('${escapeQuotes(ch.url)}', '_blank')">
                        <button onclick="event.stopPropagation(); toggleFavorite('${escapeQuotes(ch.id)}')" class="absolute top-3 right-3 text-gray-500 hover:text-amber-400 p-1.5 transition-colors ${isFav ? 'text-amber-400' : ''}">
                            <i class="${isFav ? 'fa-solid' : 'fa-regular'} fa-star"></i>
                        </button>
                        <div class="flex items-center space-x-3 mb-3">
                            <div class="flex-shrink-0">${logoHtml}</div>
                            <div class="min-w-0 flex-1 pr-4">
                                <h3 class="font-semibold text-sm text-gray-200 truncate group-hover:text-indigo-400 transition-colors" title="${escapeHtml(ch.name)}">${escapeHtml(ch.name)}</h3>
                                <p class="text-xs text-gray-500 truncate mt-0.5">${escapeHtml(ch.category)}</p>
                            </div>
                        </div>
                        <button class="w-full mt-2 py-1.5 bg-dark-700 group-hover:bg-indigo-600 text-gray-300 group-hover:text-white rounded-xl text-xs font-medium flex items-center justify-center space-x-1.5 transition-colors">
                            <i class="fa-solid fa-play text-[10px]"></i>
                            <span>Stream öffnen</span>
                        </button>
                    </div>
                `;
            });

            channelsGrid.innerHTML = html;
        }

        window.toggleFavorite = function(id) {
            if (favorites.includes(id)) {
                favorites = favorites.filter(favId => favId !== id);
            } else {
                favorites.push(id);
            }
            localStorage.setItem('iptv_favorites', JSON.stringify(favorites));
            document.getElementById('count-favs').textContent = favorites.length;
            renderChannels();
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;');
        }

        function escapeQuotes(str) {
            if (!str) return '';
            return str.replace(/'/g, "\\'").replace(/"/g, '&quot;');
        }

        initAlphabetBar();
        loadPlaylist(DEFAULT_M3U_URL);
    </script>
</body>
</html>
